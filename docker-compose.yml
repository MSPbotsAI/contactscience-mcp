services:
  contactscience-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: contactscience-mcp:latest
    container_name: contactscience-mcp-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MCP_HTTP_PORT=8080
      - CONTACTSCIENCE_BASE_URL=https://www.klpzmedia.com/apis/1.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
